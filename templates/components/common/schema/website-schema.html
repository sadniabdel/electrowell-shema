{{!-- WebSite Schema with SearchAction --}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "url": "{{urls.home}}",
  "name": "Electrowell",
  "description": "Industrial Automation & Drives - Your trusted source for Danfoss, Emerson, Schneider Electric, ABB, Siemens and more",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{urls.search}}?search_query={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>
