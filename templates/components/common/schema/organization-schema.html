{{!-- Organization Schema with contact and social profiles --}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Electrowell",
  "url": "{{urls.home}}",

    "availableLanguage": ["de", "en"]

}
