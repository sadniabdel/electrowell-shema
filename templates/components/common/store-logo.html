<a href="{{urls.home}}">
    {{#if settings.store_logo.image}}
        <img class="header-logo-image" src="{{getImage settings.store_logo.image}}" alt="{{settings.store_logo.title}}" title="{{settings.store_logo.title}}" width="483" height="98" loading="eager">
    {{else}}
        <span class="header-logo-text">{{settings.store_logo.title}}</span>
    {{/if}}
</a>
